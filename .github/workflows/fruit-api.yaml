name: fruit-api-service
on:
 pull_request:
 push:
    branches:
      - main
 workflow_dispatch: 
   inputs:
     repository_name: 
       type: string
       default: required

     environments:
        type: choice
        default: dev
        options:
          - dev
          - staging
          - prod
     version:
       type: string
       default: required

     dry_run:
       type: boolean
       default: true
    
    
env:
  docker_username: $DOCKER_USERNAME
  docker_password: $DOCKER_PASSWORD  

jobs:
  pullingsourcecode:
    runs-on: ubuntu-latest
    steps:
        - name: pull code from github
          uses: actions/checkout@v5
          with:
              repository: sai-niharika726/DEVOPS
              reference: master


        - name: building image
          run: |
            docker login --username ${{ env.docker_username }} --password ${{ secrets.docker_password }}  
            docker build -t myimage Fruit-app-store
            

        - name: trivy scan
          run: |
           trivy image --serverity== HIGH,CRITICAL --exit-code 1 myimage
           echo "Image has critical or High vulnerabilites"

        - name: tagging and pushing image
          run: | 
           docker login --username ${{ env.docker_username }} --password ${{ secrets.docker_password }}
           docker tag myimage ${{ env.docker_username }}/${{ inputs.repository_name }}: v1
           docker push ${{ env.docker_username }}/${{ inputs.repository_name }}: v1

  notification:
    runs-on: ubuntu-latest
    needs: pullingsourcecode
    if: failure()
    steps:
       - name: checking the build
         run: echo "Build is failed"
  
  
           
           

      
         

       
 

