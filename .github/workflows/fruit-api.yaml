name: fruit-api-service
on:
 workflow_dispatch:
 pull_request:
 push:
    branches:
      - main

inputs:
  repository_name: bsainiharika
  type: string
  default: true

  environments:
    type: choose
    default: dev
    options:
      - dev
      - staging
      - prod
  version:
    type: text
    default: required

  dry_run:
    type: boolean
    default: true
    
    
env:
  docker_username: $ {{ DOCKER_USERNAME }}
  docker_password: $ {{ DOCKER_PASSWORD }}
  

jobs:
  pulling sourcecode:
    runs-on: ubuntu-latest
    steps:
        - name: pull code from github
          uses: actions/checkout
          reference:
            path: sai-niharika726/DEVOPS
            branches: main


        - name: building image
          run: |
            docker login --username ${{ env.docker_username }} --pasword-stdin ${{ secrets.docker_password }}
            docker build -t myimage Frit-app-store
            

        - name: trivy scan
          run: trivy image myimage
          if : severity == 'critical' or severity == 'HIGH'
          exit 1
          run: echo "Image has critical or High vulnerabilites"

        - name: tagging and pushing image
          run: | 
           docker login --username ${{ env.docker_username }} --pasword ${{ secrets.docker_password }}
           docker tag myimage ${{ env.docker_username }}/${{ inputs.repository_name }}: v1
           docker push ${{ env.docker_username }}/${{ inputs.repository_name }}: v1

notification:
  runs-on: ubuntu-latest
  needs: pulling-sourcecode
  if: success()
  run: echo "Build is success"
  
  
           
           

      
         

       
 

