name: Multiple env with parameters
on:
 workflow_dispatch:
   inputs:
     environment:
       type: choice
       options:
         - dev
         - staging
         - production
     replicas:
        type: number
     deploy:
        type: boolean

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: validation
        if: ${{ inputs.replicas <= 0 }}
        run: echo "replicas should be Greater than 2"
  deploy:
    runs-on: ubuntu-latest
    needs: validate
    steps:
    - name: Deploying
      if: ${{ inputs.deploy == true }}
      run: echo "${{ inputs.environment }} and replica count is - ${{ inputs.replicas }}"

  notify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
    - name: notify
      run: echo "Deployment completed successfully"
