name: triggering a build
on:
   push:
     branches:
       - main
   workflow_dispatch: 
     inputs:
       image_name:
         type: string
         default: fruit-app-store:v1
         required: true
   
concurrency: 
   group: build-${{ github.ref_name }}
   
      
jobs:
  ci:
   runs-on: ubuntu-latest
   env:
     docker_username: bsainiharika
     docker_password: ${{ secrets.DOCKER_PASSWORD }}
     
   steps:
     - name: checkout application code
       uses: actions/checkout@v5
       with:
         repository: sai-niharika726/DEVOPS
         ref: master


     - name: build the docker image
       run: |
         docker login --username ${{ env.docker_username }} --password ${{ secrets.docker_password }}
         docker build -t ${{ inputs.image_name }} Fruit-app-store/
         docker images | grep ${{ inputs.image_name }}

     - name: display tag name
       if: success()
       run: echo "tag is ${{ inputs.image_name }}"

     - name: install trivy
       uses: aquasecurity/setup-trivy@v0.3.1

     - name: scan image
       if: success()
       id: security_scan
       run: |
         trivy image ${{ inputs.image_name }} >> vulnerability-report
         ls -lart
         cat vulnerability-report
       

    
       
