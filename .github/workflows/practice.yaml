name: Testing GH actions
on:
 push:
   branches:
      - main
 workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Testing env variables and secrets
        env:
          APP_NAME: ${{ vars.APP_NAME }}
          FAKE_KEY: ${{ secrets.FAKE_KEY }}
        run: |
          echo "App name is $APP_NAME"
          echo "App secret is $FAKE_KEY"

  matrix-practice:
    strategy: 
      matrix:
        os: [ubunutu-latest, windows-latest]
        version: [1,2]
    runs-on : ${{ matrix.os }}
    steps:
      - name: show matrix values
        run:
          echo ${{ matrix.os }} and ${{ matrix.version }}
         
