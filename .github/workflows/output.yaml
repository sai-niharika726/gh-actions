name: working on output files
on:
 workflow_dispatch:
   inputs:
     tag_name:
       type: string
       required: true

env:
  docker_username: bsainiharika
  docker_password: $DOCKER_PASSWORD

jobs:
  app-code:
    runs-on: ubuntu-latest
    steps:
      - name: pulling code from gh
        uses: actions/checkout@v5
        with:
          repository: sai-niharika726/DEVOPS
          ref: master
          
      - name: build a docker image
        run: |
          docker login --username ${{ env.docker_username }} --password ${{ secrets.docker_password }}
          docker build -t ${{ inputs.tag_name }} Fruit-app-store/
    
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.3.1

      - name: run the trivy scan
        run: |
          trivy image ${{ inputs.tag_name  }} >> reports/vulnerability-report
      - uses: actions/upload-artifact@v5
        with:
          name: vulnerability-report
          path: reports/
          retention-days: 5
        
  report:
    needs: app-code
    runs-on: ubuntu-latest
    steps:
    - name: download artifact
      uses: actions/download-artifact@v5
      with:
        name: vulnerability-report
        path: report
        
    - name: print report
      run: report/vulnerability-report
  push:
    needs: [app-code,report] 
    runs-on: ubuntu-latest
    steps:
      - name: pushing to dockerhub
        run: |
          docker tag ${{ inputs.tag_name }} bsainiharika/ghactions-fruit-app-store:${{ inputs.tag_name}}-v1
          docker push bsainiharika/ghactions-fruit-app-store:${{ inputs.tag_name}}-v1

      
     
        
         

       

     
      
        
      

      

      
