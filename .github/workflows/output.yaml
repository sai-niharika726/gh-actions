name: working on output files
on:
 workflow_dispatch:
 push:
   branches:
      - master
      - main
env:
  docker_username: bsainiharika
  docker_password: $DOCKER_PASSWORD

jobs:
  app-code:
    runs-on: ubuntu-latest
    steps:
      - name: pulling code from gh
        uses: actions/checkout@v5
        with:
          repository: sai-niharika726/DEVOPS
          ref: master
          path: FRUIT-APP-STORE
        

      - name: generate sha tag
        id: image
        run: | 
          sha=$(git rev-parse --short HEAD)
          echo "tag=$sha" >> "$GITHUB_OUTPUT"
      - name: build a docker image
        run: |
          docker login --username ${{ env.docker_username }} --password ${{ secrets.docker_password }}
          docker build -t ${{ steps.image.outputs.tag }} FRUIT-APP-STORE
    
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.3.1

      - name: run the trivy scan
        if: success()
        run: trivy image ${{ steps.image.outputs.tag }}

      

      
