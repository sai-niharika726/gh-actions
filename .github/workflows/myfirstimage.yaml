name: fruit-store
on:
 push:
  branches:
   - main
 pull_request: 
   branches:
       - main
 workflow_dispatch: 
  
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: pulling code from github
        uses: actions/checkout@v5
        with:
          repository: sai-niharika726/DEVOPS
          ref: master
  
      - name: Building docker image
        env:
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
        run: |
          cd Fruit-app-store
          docker login --username "$username" --password "$password"
          docker build -t myimage .
          
  pushimage:
       runs-on: ubuntu-latest
       needs: build
       steps:
         - name: Pushing image to dockerhub
           run: |
              docker images
              docker tag myimage bsainiharika/ghaction:v1
              docker push bsainiharika/ghaction:v1
          
 
         - name: success
           if: success()
           run: echo "build success"

         - name: failure
           if: failure()
           run: echo "build failed"
