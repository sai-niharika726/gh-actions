name: fruit-store
on:
 push:
  branches:
   - main
 pull_request: 
   branches:
       - main
 workflow_dispatch: 
  
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: pulling code from github
        uses: actions/checkout@v5
        with:
          repository: sai-niharika726/DEVOPS
          ref: master
  
      - name: Building docker image
        env:
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
        run: |
          cd Fruit-app-store
          docker login --username "$username" --password "$password"
          docker build -t myimage .
      - name: Save image as file
        run: docker save myimage -o image.tar
      - name: Uplaod artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar
          
  pushimage:
       runs-on: ubuntu-latest
       needs: build
       steps:
         - name: Downalod artifact
           uses: actions/download-artifact@v4
           with:
             name: docker-image
         - name: Load image
           run: docker load -i image.tar

         - name: Login, tag and push
           env:
            username: ${{ secrets.USERNAME }}
            password: ${{ secrets.PASSWORD }} 
           run: |
          
              docker tag myimage bsainiharika/ghaction:v1
              docker push bsainiharika/ghaction:v1
          
 
         - name: success
           if: success()
           run: echo "build success"

         - name: failure
           if: failure()
           run: echo "build failed"
