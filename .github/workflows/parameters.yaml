name: parameterized workflow
on:
  workflow_dispatch:
     inputs:
      environment:
         type: choice
         options:
           - dev
           - staging
         default: dev
      dryrun:
        type: boolean
        default: true
      version:
        type: string
        required: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: prints the values choosen by user
        run: echo "${{ inputs.environment }} and ${{ inputs.dryrun }} and ${{ inputs.version }}"

  deploy:
    runs-on: ubuntu-latest
    needs: validate
    if: ${{ inputs.dryrun == false }}
    steps:
      - name: testing
        run: echo "Deploying ${{ inputs.version }} to  ${{ inputs.environment }}"
        

    

 
    
        
  


